# Builds the help site and publishes it to GitHub Pages.
# Runs when the guide changes, and every night so that button names and
# messages follow the latest scandroid main (copied by sync_app_text.py).
name: Publish help site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the app's latest text (scandroid main)
        uses: actions/checkout@v4
        with:
          repository: rodekruis/scandroid
          ref: main
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: python scripts/sync_app_text.py src
      - run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
